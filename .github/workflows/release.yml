# Builds the app on every push to main and publishes it as a GitHub release, so the phone can
# install it with Obtainium (or from the release page). See docs/INSTALL.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is the commit count, which needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Sign with the same debug key as the app on the phone, so the release installs over it and
      # keeps the rides. Without that key, stop: a differently signed app can't update it.
      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is missing. See docs/INSTALL.md."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      # No local.properties here: live sharing stays off, so its key never ends up in the public APK.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.$(git rev-list --count HEAD)"
          apk="tegenwind-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "v$version" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Tegenwind $version" \
            --notes "$(git log -1 --format=%s)" \
            --latest
